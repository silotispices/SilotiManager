services:
  stock-manager:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      OPEN_BROWSER: "0"
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
      DB_PATH: /data/siloti_stock.sqlite3
    volumes:
      - stock-data:/data
    expose:
      - "8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - stock-manager
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  stock-data:
  caddy-data:
  caddy-config:
