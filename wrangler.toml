name = "siloti-manager"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/bill/*"]

[[d1_databases]]
binding = "DB"
database_name = "siloti-manager"
database_id = "0e6e764f-a6e6-4a2b-b5c4-4aedaf141460"
migrations_dir = "migrations"
